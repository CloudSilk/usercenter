[metadata]
name = usercenter-client
version = 0.1.0
description = UserCenter REST API Python SDK
readme = README.md
requires-python = >=3.9
dependencies =
    requests >=2.28

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project.optional-dependencies]
dev =
    pytest >=7
    pytest-httpserver >=1.0
